# =======================================================
# Production Profile (prod)
# =======================================================

spring.datasource.url=jdbc:h2:mem:postdb_prod;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=prodSecretPassword123

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

logging.level.com.deadbeat.postapi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.FrameworkServlet=ERROR
