spring.application.name=demo
server.port=8080

# Active Spring Profile (default: dev; can be overridden via -Dspring.profiles.active or SPRING_PROFILES_ACTIVE)
spring.profiles.active=dev

# Shared Logging Settings (File-based logging)
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.%i.log