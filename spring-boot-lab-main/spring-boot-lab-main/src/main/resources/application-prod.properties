# =======================================================
# Production Profile (prod)
# =======================================================

# H2 In-Memory Database (file-persistent or production-ready settings)
spring.datasource.url=jdbc:h2:mem:proddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=prodSecretPassword123

# JPA (do not drop schema, do not log verbose SQL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console DISABLED for security in production
spring.h2.console.enabled=false

# Minimal, high-performance logging
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.FrameworkServlet=ERROR
logging.level.org.hibernate=WARN
